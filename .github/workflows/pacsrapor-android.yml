# PacsRapor Destek Merkezi — Android (destek ekibi programı; yalnız giden bağlantı, PR_VARIANT=support).
# Upstream flutter-build.yml "build-rustdesk-android" işinden sadeleştirildi: arm64 + armv7, markalama (ad, paket kimliği,
# ikon) derleme anında uygulanır, APK kendi anahtarımızla (ANDROID_* gizli değerleri, PKCS12) apksigner ile imzalanır.
# Elle çalıştırılır (Actions → Run workflow) ya da pr-android-* etiketi itilince sürüm olarak yayınlanır.
name: PacsRapor Android

on:
  workflow_dispatch:
  push:
    tags: ["pr-android-*"]

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.5.0"
  PR_APP_NAME: "PacsRapor Destek Merkezi"
  PR_APP_ID: "com.pacsrapor.destekmerkezi"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: [generate-bridge]
    name: android-${{ matrix.job.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: aarch64, target: aarch64-linux-android, abi: arm64-v8a, ndk: ndk_arm64.sh, platform: android-arm64, libcpp: aarch64-linux-android }
          - { arch: armv7, target: armv7-linux-androideabi, abi: armeabi-v7a, ndk: ndk_arm.sh, platform: android-arm, libcpp: arm-linux-androideabi }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libc6-dev libclang-dev llvm-dev \
               nasm ninja-build openjdk-17-jdk-headless pkg-config wget imagemagick

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: PacsRapor branding (ad, paket kimliği, ikon)
        shell: bash
        run: |
          set -e
          A=flutter/android/app
          sed -i "s/applicationId \"com.carriez.flutter_hbb\"/applicationId \"${PR_APP_ID}\"/" $A/build.gradle
          sed -i "0,/android:label=\"RustDesk\"/s//android:label=\"${PR_APP_NAME}\"/" $A/src/main/AndroidManifest.xml
          sed -i "s/android:label=\"RustDesk Input\"/android:label=\"${PR_APP_NAME} Girdi\"/" $A/src/main/AndroidManifest.xml
          grep -n "applicationId" $A/build.gradle
          grep -n "android:label" $A/src/main/AndroidManifest.xml
          S=res/pacsrapor/icon-512.png
          R=$A/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n a f <<< "$d"
            convert $S -resize ${a}x${a} -strip PNG32:$R/mipmap-$n/ic_launcher.png
            convert $S -resize ${a}x${a} \( -size ${a}x${a} xc:black -fill white -draw "circle $((a/2)),$((a/2)) $((a/2)),0" \) \
              -alpha off -compose copy_opacity -composite -strip PNG32:$R/mipmap-$n/ic_launcher_round.png
            i=$((f*61/100))
            convert -size ${f}x${f} xc:none \( $S -resize ${i}x${i} \) -gravity center -composite -strip PNG32:$R/mipmap-$n/ic_launcher_foreground.png
          done
          file $R/mipmap-xxxhdpi/*.png

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: pacsrapor-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          PR_VARIANT: support
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.ndk }}

      - name: Build apk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # derleme geçici debug imzasıyla; yayın APK'sı aşağıda kendi anahtarımızla yeniden imzalanır
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          J=./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          mkdir -p $J
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.libcpp }}/libc++_shared.so $J/
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so $J/librustdesk.so
          pushd flutter
          flutter build apk --release --target-platform ${{ matrix.job.platform }} --split-per-abi
          popd
          mkdir -p out
          mv flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk out/unsigned.apk

      - name: Sign apk (PacsRapor anahtarı)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KS_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BT"
          echo "$KS_B64" | base64 -d > /tmp/pr.p12
          F="out/destek-merkezi-${{ env.VERSION }}-${{ matrix.job.arch }}.apk"
          "$BT/zipalign" -f -p 4 out/unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks /tmp/pr.p12 --ks-type PKCS12 --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$F" out/aligned.apk
          rm -f /tmp/pr.p12 out/unsigned.apk out/aligned.apk
          "$BT/apksigner" verify --print-certs "$F" | grep -E "SHA-256|DN" || true
          "$BT/aapt2" dump badging "$F" | grep -E "^package:|application-label:" || true
          sha256sum "$F"

      - name: Upload apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: destek-merkezi-android-${{ matrix.job.arch }}
          path: out/*.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/pr-android-')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          prerelease: true
          files: out/*.apk
